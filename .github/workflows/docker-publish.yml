name: Publish Docker image

on:
  workflow_dispatch:

# Serialize runs so two dispatches cannot bump the same patch version.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          for file in package.json cli/package.json; do
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const source = fs.readFileSync(file, "utf8");
              const bumped = source.replace(
                /("version":\s*"\d+\.\d+\.)(\d+)(")/,
                (_, head, patch, tail) => head + (Number(patch) + 1) + tail
              );
              if (bumped === source) throw new Error(`no version found in ${file}`);
              fs.writeFileSync(file, bumped);
            ' "$file"
          done
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumped to $version"

      - name: Commit and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $VERSION"
          git push origin master

  build:
    name: Build ${{ matrix.platform }}
    needs: bump
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ needs.bump.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=9router-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=9router-${{ matrix.suffix }}

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.suffix }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    name: Publish manifest
    needs:
      - bump
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            sources+=("${IMAGE}@$(tr -d '\n' < "$digest_file")")
          done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "Expected 2 platform digests, found ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Smoke-test published image
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          set -Eeuo pipefail
          container="9router-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --platform linux/amd64 \
            --publish 20128:20128 "${IMAGE}:${VERSION}"
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed; logs follow:" >&2
          docker logs "$container" || true
          exit 1

      - name: Summary
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          {
            echo "### Published ${VERSION}"
            echo "- \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64)"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
